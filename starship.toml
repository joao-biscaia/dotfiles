"$schema" = 'https://starship.rs/config-schema.json'

# Rosé Pine theme to match nvim + iTerm2. Previous config: starship.toml.bak
#
#    ~/.config/nvim   main !1 ?2   5.4   med-ai-sandbox        took 3s  14:02
#   ❯

add_newline = true
palette = "rose_pine"

format = """
$directory\
$git_branch\
$git_state\
$git_status\
$lua\
$python\
$nodejs\
$golang\
$rust\
$docker_context\
$aws\
$line_break\
$character"""

right_format = "$cmd_duration$time"

[palettes.rose_pine]
base = "#191724"
surface = "#1f1d2e"
overlay = "#26233a"
muted = "#6e6a86"
subtle = "#908caa"
text = "#e0def4"
love = "#eb6f92"
gold = "#f6c177"
rose = "#ebbcba"
pine = "#31748f"
foam = "#9ccfd8"
iris = "#c4a7e7"

[character]
success_symbol = "[❯](bold iris)"
error_symbol = "[❯](bold love)"
vimcmd_symbol = "[❮](bold foam)"

[directory]
format = "[ $path]($style)[$read_only]($read_only_style) "
style = "bold iris"
read_only = " 󰌾"
read_only_style = "love"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "bold rose"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "gold"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!${count}"
untracked = "?${count}"
staged = "+${count}"
deleted = "✘${count}"
conflicted = "=${count}"
stashed = "≡"

[git_state]
style = "bold love"

[aws]
format = "[$symbol$profile]($style) "
symbol = " "
style = "subtle"

[lua]
format = "[$symbol$version]($style) "
symbol = " "
style = "foam"
version_format = "${major}.${minor}"

[python]
format = '[$symbol$version( \($virtualenv\))]($style) '
symbol = " "
style = "foam"
version_format = "${major}.${minor}"

[nodejs]
format = "[$symbol$version]($style) "
symbol = " "
style = "foam"
version_format = "${major}.${minor}"

[golang]
format = "[$symbol$version]($style) "
symbol = " "
style = "foam"

[rust]
format = "[$symbol$version]($style) "
symbol = " "
style = "foam"

[docker_context]
format = "[$symbol$context]($style) "
symbol = " "
style = "pine"

[cmd_duration]
min_time = 2000
format = "[took $duration]($style) "
style = "gold"

[time]
disabled = false
format = "[$time]($style)"
time_format = "%H:%M"
style = "muted"

[package]
disabled = true
